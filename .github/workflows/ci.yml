name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt into more if they ever need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser tests record for real: they need Playwright's Chromium (and
      # its system libraries) plus ffmpeg on PATH for the full renders.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and ffmpeg
        run: |
          pnpm --filter @narrate/core exec playwright install --with-deps chromium ffmpeg
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          # Fail, rather than skip, if the browser tests can't run.
          NARRATE_REQUIRE_BROWSER: "1"

      - name: Build
        run: pnpm --filter @narrate/core build

      - name: Ensure the committed plugin bundle is up to date
        run: |
          if ! git diff --exit-code -- packages/plugin/bin/narrate.mjs; then
            echo "::error::packages/plugin/bin/narrate.mjs is stale. Run 'pnpm --filter @narrate/core build' and commit the result."
            exit 1
          fi
