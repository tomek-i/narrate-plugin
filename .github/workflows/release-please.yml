name: Release Please

# On every push to main, open/refresh a release PR that bumps the version in
# package.json, packages/*/package.json and the plugin manifest (the field
# `/plugin` compares to detect updates). Merging that PR tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PR opened with the default GITHUB_TOKEN doesn't get a CI run that
          # can pass, so the required `check` blocks the release PR. A personal
          # token makes the PR count as the owner's and CI runs normally. Falls
          # back to the default token until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
